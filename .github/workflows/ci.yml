name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: owldoc
      - uses: actions/checkout@v5
        with:
          repository: co-ode-owl-plugins/ontology-browser
          ref: 0b2fd113e0ee7d9ee3d9ca0c653499772a2f0024
          path: ontology-browser
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Install paired Ontology Browser snapshot
        working-directory: ontology-browser
        run: mvn --batch-mode clean install
      - name: Verify OWLDoc
        working-directory: owldoc
        run: mvn --batch-mode clean verify
